<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    
    <div class="numpad">
        <div class="result-display">
            <span class="num-prev"></span>
            <span class="num"></span>
        </div>
        <div class="bottom">
            <div class="number-container">
                <button class="num-btn">1</button>
                <button class="num-btn">2</button>
                <button class="num-btn">3</button>
                <button class="num-btn">4</button>
                <button class="num-btn">5</button>
                <button class="num-btn">6</button>
                <button class="num-btn">7</button>
                <button class="num-btn">8</button>
                <button class="num-btn">9</button>
                <button class="num-btn point">.</button>
                <button class="num-btn">0</button>
                <button class="num-btn plus-minus">+/-</button>
                
            </div>
            <div class="operator">
                <button class="operator-btn back">Back</button>
                <button class="operator-btn clear">CL</button>
                <button class="operator-btn">+</button>
                <button class="operator-btn">-</button>
                <button class="operator-btn">x</button>
                <button class="operator-btn">/</button>
                <button class="operator-btn equal">=</button>
            </div>
        </div>
        
    </div>
</body>
</html>
